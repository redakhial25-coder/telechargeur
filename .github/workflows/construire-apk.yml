name: Construire l'APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Construire
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Renommer les APK
        run: |
          mkdir sortie
          cp app/build/outputs/apk/debug/app-arm64-v8a-debug.apk     sortie/Telechargeur-arm64.apk
          cp app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk   sortie/Telechargeur-ancien-telephone.apk
          cp app/build/outputs/apk/debug/app-universal-debug.apk     sortie/Telechargeur-universel.apk
          ls -lh sortie

      - uses: actions/upload-artifact@v4
        with:
          name: Telechargeur-APK
          path: sortie/*.apk

      - name: Publier (lien de téléchargement direct)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Téléchargeur v1.${{ github.run_number }}
          files: sortie/*.apk
